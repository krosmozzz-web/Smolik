name: Android APK
on:
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект, если залит одним архивом
        run: |
          if [ -f smolik-rs-online.zip ]; then unzip -q smolik-rs-online.zip && cd smolik-rs; fi
          cargo test -p smolik-core
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект, если залит одним архивом
        run: |
          if [ -f smolik-rs-online.zip ]; then unzip -q smolik-rs-online.zip; fi
          if [ -d smolik-rs ]; then echo "PROJ=smolik-rs" >> "$GITHUB_ENV"; else echo "PROJ=." >> "$GITHUB_ENV"; fi
      - name: Собрать APK
        run: |
          cd "$PROJ"
          docker run --rm -v "$PWD":/root/src -w /root/src/app notfl3/cargo-apk cargo quad-apk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: smolik-apk
          path: ${{ env.PROJ }}/target/android-artifacts/**/*.apk
